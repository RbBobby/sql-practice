name: interview-sql-lab
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: practice_local_only
      POSTGRES_DB: interview_lab
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d interview_lab"]
      interval: 3s
      timeout: 3s
      retries: 30
